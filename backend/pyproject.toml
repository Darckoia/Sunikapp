[project]
name = "sunikflow-backend"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116.0",
  "uvicorn>=0.35.0",
  "sqlalchemy>=2.0.43",
  "pydantic>=2.11.7",
  "pydantic-settings>=2.10.1",
  "numpy>=2.3.2",
  "scipy>=1.16.1",
  "librosa>=0.11.0",
  "soundfile>=0.13.1",
  "python-multipart>=0.0.20",
  "aiofiles>=24.1.0",
  "python-dotenv>=1.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["backend"]
