[project]
name = "sunikflow"
version = "1.0.0"
description = "SUNIKFLOW - Audio generation and synthesis platform with FastAPI backend"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "psycopg2-binary>=2.9.0",
    "alembic>=1.12.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.6",
]

[tool.uv]
package = false
