<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - SUNIKFLOW</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/settings.css">
</head>
<body>
    <nav class="navbar">
        <div class="navbar-container">
            <div class="logo">
                <span class="logo-icon">🎵</span>
                <span class="logo-text">SUNIKFLOW</span>
            </div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="studio.html">Studio</a></li>
                <li><a href="library.html">Library</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="settings.html" class="active">Settings</a></li>
            </ul>
        </div>
    </nav>

    <main class="settings-container">
        <div class="settings-sidebar">
            <div class="settings-menu">
                <a href="#profile" class="settings-link active" onclick="switchSettings('profile')">Profile</a>
                <a href="#audio" class="settings-link" onclick="switchSettings('audio')">Audio</a>
                <a href="#appearance" class="settings-link" onclick="switchSettings('appearance')">Appearance</a>
                <a href="#advanced" class="settings-link" onclick="switchSettings('advanced')">Advanced</a>
            </div>
        </div>

        <div class="settings-content">
            <div id="profile" class="settings-section active">
                <h2>Profile Settings</h2>
                <form class="settings-form">
                    <div class="form-group">
                        <label>Username</label>
                        <input type="text" class="input-text" value="username">
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" class="input-text" value="user@example.com">
                    </div>
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                </form>
            </div>

            <div id="audio" class="settings-section" style="display: none;">
                <h2>Audio Settings</h2>
                <form class="settings-form">
                    <div class="form-group">
                        <label>Sample Rate</label>
                        <select class="input-text">
                            <option value="44100">44100 Hz</option>
                            <option value="48000">48000 Hz</option>
                            <option value="96000">96000 Hz</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Bit Depth</label>
                        <select class="input-text">
                            <option value="16">16-bit</option>
                            <option value="24">24-bit</option>
                            <option value="32">32-bit</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary">Save Settings</button>
                </form>
            </div>

            <div id="appearance" class="settings-section" style="display: none;">
                <h2>Appearance</h2>
                <form class="settings-form">
                    <div class="form-group">
                        <label>Theme</label>
                        <select class="input-text">
                            <option value="dark">Dark</option>
                            <option value="light">Light</option>
                            <option value="auto">Auto</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary">Save Preferences</button>
                </form>
            </div>

            <div id="advanced" class="settings-section" style="display: none;">
                <h2>Advanced Settings</h2>
                <form class="settings-form">
                    <div class="form-group">
                        <label class="checkbox">
                            <input type="checkbox" checked>
                            <span>Enable Autosave</span>
                        </label>
                    </div>
                    <div class="form-group">
                        <label class="checkbox">
                            <input type="checkbox" checked>
                            <span>Enable Notifications</span>
                        </label>
                    </div>
                    <button type="submit" class="btn btn-primary">Save Settings</button>
                </form>
            </div>
        </div>
    </main>

    <script src="js/settings.js"></script>
</body>
</html>
