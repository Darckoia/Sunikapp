<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library - SUNIKFLOW</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/library.css">
</head>
<body>
    <nav class="navbar">
        <div class="navbar-container">
            <div class="logo">
                <span class="logo-icon">🎵</span>
                <span class="logo-text">SUNIKFLOW</span>
            </div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="studio.html">Studio</a></li>
                <li><a href="library.html" class="active">Library</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="settings.html">Settings</a></li>
            </ul>
        </div>
    </nav>

    <main class="library-container">
        <div class="library-header">
            <h1>Track Library</h1>
            <div class="library-controls">
                <input type="text" placeholder="Search tracks..." class="input-text" id="searchInput">
                <select class="input-text" id="sortBy">
                    <option value="recent">Most Recent</option>
                    <option value="name">Name</option>
                    <option value="duration">Duration</option>
                </select>
            </div>
        </div>

        <div class="library-content">
            <div class="tracks-grid" id="tracksGrid">
                <!-- Track cards will be generated here -->
            </div>
        </div>

        <div class="empty-state" id="emptyState" style="display: none;">
            <p>No tracks found</p>
            <p class="text-muted">Create your first audio track in the Studio</p>
            <a href="studio.html" class="btn btn-primary">Go to Studio</a>
        </div>
    </main>

    <script src="js/library.js"></script>
</body>
</html>
